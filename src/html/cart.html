<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - Fashion Store</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/navbar.css">
    <link rel="stylesheet" href="../css/pages/cart.css">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="navbar-left">
                <button class="menu-toggle" aria-label="菜单">
                    <span>男装</span>
                    <span>女装</span>
                    <span>配饰</span>
                </button>
                <ul class="nav-links">
                    <li><a href="index.html">首页</a></li>
                    <li>
                        <a href="shop.html" class="dropdown-toggle">商品分类</a>
                        <ul class="dropdown-menu">
                            <li><a href="shop.html?category=women">女装</a></li>
                            <li><a href="shop.html?category=men">男装</a></li>
                            <li><a href="shop.html?category=accessories">配饰</a></li>
                        </ul>
                    </li>
                    <li><a href="about-pages/brand-story.html">品牌故事</a></li>
                </ul>
            </div>
            
            <div class="navbar-center">
                <a href="index.html" class="logo">
                    <img src="../public/images/icons/logo.png" alt="FASHION" class="logo-img">
                </a>
            </div>
            
            <div class="navbar-right">
                <div class="user-status">
                    <!-- 用户状态将由JS动态生成 -->
                </div>
                <div class="nav-icons">
                    <a href="shop.html" class="icon-link">
                        <img src="../public/images/icons/shop.png" alt="购物" class="icon">
                    </a>
                    <a href="cart.html" class="icon-link cart-icon">
                        <img src="../public/images/icons/cart.png" alt="购物车" class="icon">
                        <span class="cart-badge">0</span>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main class="cart-container">
        <!-- 购物车标题 -->
        <div class="cart-header">
            <h1>购物车</h1>
            <span class="item-count">0件商品</span>
        </div>

        <!-- 购物车内容 -->
        <div class="cart-content">
            <!-- 商品列表 -->
            <div class="cart-list">
                <!-- 商品项模板 -->
                <template id="cartItemTemplate">
                    <div class="cart-item" data-id="">
                        <div class="item-checkbox">
                            <input type="checkbox" class="select-item" onclick="window.cartManager.toggleSelectItem(this.closest('.cart-item').dataset.id, this.checked)">
                        </div>
                        <div class="item-image">
                            <img src="" alt="">
                        </div>
                        <div class="item-info">
                            <h3 class="item-name"></h3>
                            <div class="item-specs">
                                <span class="color"></span>
                                <span class="size"></span>
                            </div>
                            <div class="item-price">
                                <span class="current-price"></span>
                                <span class="original-price"></span>
                            </div>
                        </div>
                        <div class="item-quantity">
                            <button type="button" class="btn-decrease" onclick="window.cartManager.updateItemQuantity(this.closest('.cart-item').dataset.id, -1)">-</button>
                            <input type="number" value="1" min="1" max="99" onchange="window.cartManager.setItemQuantity(this.closest('.cart-item').dataset.id, parseInt(this.value) || 1)">
                            <button type="button" class="btn-increase" onclick="window.cartManager.updateItemQuantity(this.closest('.cart-item').dataset.id, 1)">+</button>
                        </div>
                        <div class="item-subtotal">
                            <span class="amount"></span>
                        </div>
                        <button class="btn-remove">
                            <i class="icon-trash"></i>
                        </button>
                    </div>
                </template>
            </div>

            <!-- 结算栏 -->
            <div class="cart-summary">
                <div class="summary-header">
                    <label class="select-all">
                        <input type="checkbox" id="selectAll" onclick="window.cartManager.toggleSelectAll(this.checked)">
                        <span>全选</span>
                    </label>
                    <button class="btn-clear" onclick="if(confirm('确定要清空购物车吗？')) window.cartManager.clearCart()">清空购物车</button>
                </div>
                <div class="summary-content">
                    <div class="summary-item">
                        <span>商品总额</span>
                        <span class="total-price">¥0.00</span>
                    </div>
                    <div class="summary-item">
                        <span>优惠金额</span>
                        <span class="discount-amount">-¥0.00</span>
                    </div>
                    <div class="summary-item">
                        <span>运费</span>
                        <span class="shipping-fee">¥0.00</span>
                    </div>
                    <div class="summary-item final">
                        <span>应付金额</span>
                        <span class="final-price">¥0.00</span>
                    </div>
                </div>
                <a href="checkout.html" class="btn-checkout" id="checkoutBtn">
                    结算 (<span class="selected-count">0</span>)
                </a>
            </div>
        </div>

        <!-- 空购物车状态 -->
        <div class="empty-cart" hidden>
            <img src="../public/images/empty-cart.svg" alt="空购物车">
            <p>购物车还是空的</p>
            <a href="shop.html" class="btn-primary">去购物</a>
        </div>
    </main>

    <!-- 移动端购物车侧边栏 -->
    <div class="cart-drawer">
        <div class="drawer-header">
            <h2>购物车</h2>
            <button class="btn-close">×</button>
        </div>
        <div class="drawer-content">
            <!-- 商品列表将动态插入 -->
        </div>
        <div class="drawer-footer">
            <div class="total-info">
                <span>合计：</span>
                <span class="final-price">¥0.00</span>
            </div>
            <a href="checkout.html" class="btn-checkout" id="drawerCheckoutBtn">
                结算 (<span class="selected-count">0</span>)
            </a>
        </div>
    </div>

    <!-- 删除确认对话框 -->
    <div class="modal" id="removeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>删除商品</h3>
                <button class="btn-close">×</button>
            </div>
            <div class="modal-body">
                <p>确定要从购物车中删除该商品吗？</p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelRemove">取消</button>
                <button class="btn-primary" id="confirmRemove">确定</button>
            </div>
        </div>
    </div>

    <script type="module" src="../js/modules/cart.js"></script>
    
    <!-- 会话管理 -->
    <script type="module">
        import { updateNavbarUserStatus } from '../js/modules/auth/session.js';
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('购物车页面加载完成，更新用户状态');
            updateNavbarUserStatus();
        });
    </script>
</body>
</html>
