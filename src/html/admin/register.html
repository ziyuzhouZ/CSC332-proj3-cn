<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员注册 - Fashion Store</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/pages/auth.css">
    <style>
        /* 管理员注册特有样式 */
        .admin-login-bg {
            background: linear-gradient(135deg, #1a1a1a, #3a3a3a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 30px 0;
        }
        
        .admin-card {
            background: #fff;
            width: 450px;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .admin-card .logo {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }
        
        .admin-card .logo::after {
            content: '管理后台';
            position: absolute;
            top: 50%;
            right: 60px;
            transform: translateY(-50%);
            background: #ff4f4f;
            color: #fff;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .admin-card .logo img {
            max-width: 150px;
        }
        
        .admin-card h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            color: #1a1a1a;
        }
        
        .admin-form .input-group {
            margin-bottom: 20px;
        }
        
        .admin-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .admin-form input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .admin-form input:focus {
            border-color: #1a1a1a;
            outline: none;
            box-shadow: 0 0 0 2px rgba(26, 26, 26, 0.1);
        }
        
        .btn-admin {
            width: 100%;
            padding: 12px;
            background-color: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .btn-admin:hover {
            background-color: #333;
        }
        
        .error-message {
            color: #ff4f4f;
            font-size: 14px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        
        .success-message {
            color: #4CAF50;
            font-size: 14px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        
        .admin-links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }
        
        .admin-links a {
            color: #ff4f4f;
            text-decoration: none;
        }
        
        .admin-links a:hover {
            text-decoration: underline;
        }
        
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .invite-code-notice {
            background-color: #fff8e6;
            border-left: 4px solid #ffcc00;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
        }
        
        .invite-code-notice strong {
            color: #e6a700;
        }
    </style>
</head>
<body class="admin-login-bg">
    <div class="admin-card">
        <div class="logo">
            <img src="../../public/images/icons/logo.png" alt="Fashion Store">
        </div>
        <h1>管理员一次性注册</h1>
        
        <div class="invite-code-notice">
            <strong>重要提示:</strong> 管理员注册需要邀请码。请联系现有管理员获取邀请码。邀请码将在使用后失效。
        </div>
        
        <form id="adminRegisterForm" class="admin-form">
            <div class="input-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="input-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="input-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required minlength="8">
            </div>
            
            <div class="input-group">
                <label for="confirmPassword">确认密码</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            
            <div class="input-group">
                <label for="inviteCode">邀请码</label>
                <input type="text" id="inviteCode" name="inviteCode" required>
            </div>
            
            <button type="submit" class="btn-admin">
                <span>注册</span>
                <div class="loading-spinner"></div>
            </button>
            
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            
            <div class="admin-links">
                <a href="login.html">返回登录</a>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const registerForm = document.getElementById('adminRegisterForm');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const loadingSpinner = document.querySelector('.loading-spinner');
            const inviteCodeField = document.getElementById('inviteCode');
            
            // 邀请码硬编码验证值
            const VALID_INVITE_CODE = '6666';
            
            // 检查是否已经登录
            const token = localStorage.getItem('admin_token');
            if (token) {
                // 已登录，跳转到管理后台
                window.location.href = 'dashboard.html';
            }
            
            // 邀请码输入验证
            inviteCodeField.addEventListener('blur', function() {
                if (inviteCodeField.value && inviteCodeField.value !== VALID_INVITE_CODE) {
                    showError('无效的邀请码');
                } else {
                    hideMessages();
                }
            });
            
            registerForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const inviteCode = document.getElementById('inviteCode').value;
                
                // 表单验证
                if (!username || !email || !password || !confirmPassword || !inviteCode) {
                    showError('请填写所有必填字段');
                    return;
                }
                
                if (password !== confirmPassword) {
                    showError('两次输入的密码不一致');
                    return;
                }
                
                if (password.length < 8) {
                    showError('密码长度至少为8个字符');
                    return;
                }
                
                // 前端邀请码验证
                if (inviteCode !== VALID_INVITE_CODE) {
                    showError('无效的邀请码');
                    return;
                }
                
                // 隐藏之前的错误消息
                hideMessages();
                
                // 显示加载状态
                loadingSpinner.style.display = 'block';
                
                // 模拟后端验证和注册成功
                setTimeout(() => {
                    loadingSpinner.style.display = 'none';
                    
                    // 保存模拟的Token和管理员信息
                    const adminToken = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                    localStorage.setItem('admin_token', adminToken);
                    localStorage.setItem('admin_data', JSON.stringify({
                        id: 1,
                        username: username,
                        email: email
                    }));
                    
                    // 显示成功消息
                    showSuccess('注册成功，即将跳转到管理后台...');
                    
                    // 延迟跳转
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 2000);
                }, 1000);
            });
            
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
            }
            
            function showSuccess(message) {
                successMessage.textContent = message;
                successMessage.style.display = 'block';
                errorMessage.style.display = 'none';
            }
            
            function hideMessages() {
                errorMessage.style.display = 'none';
                successMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
